[project]
name = "aviation-parts-catalog"
version = "0.1.0"
description = "Лабораторная работа 3: каталог авиационных деталей"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "ruff==0.12.0",
    "mypy==1.18.1",
    "pre-commit>=4,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
